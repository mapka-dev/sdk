name: "[PR] Claude Code Review"

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    if: |
      github.event.pull_request.author_association == 'OWNER' ||
      github.event.pull_request.author_association == 'MEMBER' ||
      github.event.pull_request.author_association == 'COLLABORATOR' ||
      github.event.pull_request.author_association == 'CONTRIBUTOR' ||
      github.event.pull_request.author_association == 'ADMIN'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Normalize PR title and description
        if: github.event.action == 'opened'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Use `gh pr view ${{ github.event.pull_request.number }}` to read the
            current title and body, then use `gh pr edit ${{ github.event.pull_request.number }}`
            to rewrite them:

            - Title: conventional commit format, lowercase type, no scope,
              imperative mood. Valid types: feat, fix, chore, refactor, docs,
              test, perf, build, ci. Example: "feat: add spend-by-metric chart".
            - Body: minimal summary — what changed and why, any breaking
              changes or migration notes. Under 10 lines. Preserve any existing
              test plan, linked issues, or reviewer notes the author already
              wrote.

            Do not comment on the PR. Do not review the code. Only edit the
            title and body.
          claude_args: |
            --model sonnet
            --dangerously-skip-permissions

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          claude_args: '--dangerously-skip-permissions'
