name: "[PR] Checks"

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
    - name: "Checkout"
      uses: actions/checkout@v7

    - name: "Setup NodeJS"
      uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: 'yarn'

    - name: Install
      run: yarn install

    - name: Build
      run: yarn build

    - name: Test
      run: yarn test
  
    - name: Lint
      run: yarn lint
